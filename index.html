<!doctype html>
<html lang="ru" class="antialiased font-nunito">
  <head>
    <meta charset="UTF-8">
    <script>
    try {
      const theme = localStorage.getItem('trix-theme')
      const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
    } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..700&family=Literata:opsz,wght@7..72,400..500&family=Onest:wght@300..700&family=Sofia+Sans+Extra+Condensed:wght@700..900&display=swap"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta
      name="description"
      content="TRIX — сервис для спикеров: регистрируйтесь, ведите профиль, управляйте докладами и лекциями в одном интерфейсе."
    >
    <meta
      name="keywords"
      content="TRIX, спикеры, доклады, лекции, speakers club, конференции, управление выступлениями, каталог докладов"
    >
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TRIX">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" content="TRIX — профили спикеров, доклады и лекции">
    <meta
      property="og:description"

    >

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TRIX — управление докладами и лекциями">
    <meta
      name="twitter:description"
      content="Сервис для спикеров и организаторов: профиль пользователя, каталог докладов и лекции с материалами."
    >
