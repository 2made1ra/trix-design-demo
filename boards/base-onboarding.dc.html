<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TRIX — онбординг, сфера и уровень</title>
<script src="./support.js"></script>
<script src="./trail.js"></script>
<script src="./cursor-fx.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:#212121}a:hover{color:#1863dc}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #4c6ee6;outline-offset:2px}
label:has(input:focus-visible){outline:2px solid #4c6ee6;outline-offset:2px}
</style>
</helmet>
<div data-fx style="min-height: 100vh; display: flex; flex-direction: column; background: #ffffff; color: #212121; font-family: Inter, Arial, ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5">

<header style="border-bottom: 1px solid #e5e7eb">
<div style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 0 clamp(20px, 4vw, 40px); min-height: 72px; display: flex; align-items: center">
<a href="#" style="font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; font-size: 24px; letter-spacing: -0.5px; color: #000000; text-decoration: none">TRIX</a>
</div>
</header>

<main style="flex: 1 1 auto; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: 56px clamp(20px, 4vw, 40px) 80px; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 14px; line-height: 1.4; letter-spacing: 0.28px; text-transform: uppercase; color: #616161">Шаг 1 из 3</span>
<div role="progressbar" aria-label="Заполнение профиля" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<span style="height: 4px; border-radius: 2px; background: #17171c"></span>
<span style="height: 4px; border-radius: 2px; background: #e5e7eb"></span>
<span style="height: 4px; border-radius: 2px; background: #e5e7eb"></span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-weight: 400; font-size: clamp(36px, 4vw, 48px); line-height: 1.2; letter-spacing: -0.01em; color: #000000">Расскажите о себе</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.4; color: #616161">По сфере и опыту выступлений подберём мероприятия, где ваш доклад будет к месту.</p>
</div>

<form style="display: flex; flex-direction: column; gap: 40px">
<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="padding: 0; margin-bottom: 16px; font-size: 20px; line-height: 1.3; color: #000000">Сфера</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid #17171c; border-radius: 30px; background: #17171c; color: #ffffff; font-size: 14px; cursor: pointer"><input type="radio" name="sphere" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Backend</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid #17171c; border-radius: 30px; background: #ffffff; color: #17171c; font-size: 14px; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Frontend</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid #17171c; border-radius: 30px; background: #ffffff; color: #17171c; font-size: 14px; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Mobile</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid #17171c; border-radius: 30px; background: #ffffff; color: #17171c; font-size: 14px; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Data и ML</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid #17171c; border-radius: 30px; background: #ffffff; color: #17171c; font-size: 14px; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">DevOps</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid #17171c; border-radius: 30px; background: #ffffff; color: #17171c; font-size: 14px; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">QA</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid #17171c; border-radius: 30px; background: #ffffff; color: #17171c; font-size: 14px; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Продукт</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid #17171c; border-radius: 30px; background: #ffffff; color: #17171c; font-size: 14px; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Дизайн</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid #17171c; border-radius: 30px; background: #ffffff; color: #17171c; font-size: 14px; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Аналитика</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid #17171c; border-radius: 30px; background: #ffffff; color: #17171c; font-size: 14px; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Другое</label>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="padding: 0; margin-bottom: 16px; font-size: 20px; line-height: 1.3; color: #000000">Опыт выступлений</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; padding: 20px; border: 1px solid #d9d9dd; border-radius: 8px; cursor: pointer">
<span style="display: flex; align-items: center; gap: 10px; font-size: 18px; line-height: 1.4; color: #000000"><input type="radio" name="level" style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: #17171c">Начинающий</span>
<span style="font-size: 14px; line-height: 1.4; color: #616161">Ещё не выступал или выступал пару раз</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; padding: 20px; border: 1px solid #d9d9dd; border-radius: 8px; cursor: pointer">
<span style="display: flex; align-items: center; gap: 10px; font-size: 18px; line-height: 1.4; color: #000000"><input type="radio" name="level" style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: #17171c">Есть опыт</span>
<span style="font-size: 14px; line-height: 1.4; color: #616161">Выступал на митапах или внутри компании</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; padding: 20px; border: 1px solid #17171c; box-shadow: inset 0 0 0 1px #17171c; border-radius: 8px; cursor: pointer">
<span style="display: flex; align-items: center; gap: 10px; font-size: 18px; line-height: 1.4; color: #000000"><input type="radio" name="level" checked style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: #17171c">Опытный</span>
<span style="font-size: 14px; line-height: 1.4; color: #616161">Регулярно выступаю на конференциях</span>
</label>
</div>
</fieldset>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 24px; border-top: 1px solid #e5e7eb">
<span style="font-size: 14px; color: #616161">Всё можно поменять позже в профиле</span>
<a href="#" style="display: inline-flex; align-items: center; gap: 8px; background: #17171c; color: #ffffff; border-radius: 32px; padding: 12px 24px; font-size: 14px; font-weight: 500; line-height: 1.71; text-decoration: none">Далее<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #ffffff; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</form>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}, "cursor": {"editor": "enum", "options": ["Слова", "Линза-негатив", "Перекрестие", "Выкл"], "default": "Слова", "section": "Эффект курсора"}, "letters": {"editor": "enum", "options": ["Мелкие", "Средние", "Крупные"], "default": "Мелкие", "section": "Эффект курсора"}, "zone": {"editor": "enum", "options": ["Как было", "Весь белый фон", "Фон и карточки", "Только карточки"], "default": "Как было", "section": "Эффект курсора"}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.start()
  }
  componentDidUpdate(prev) {
    if (window.TrixFX?.keys.some(k => prev[k] !== this.props[k])) {
      this.stop()
      this.start()
    }
  }
  componentWillUnmount() {
    this.stop()
  }
  start() {
    const T = window.TrixTrail
    this.stopFx = window.TrixFX?.run(this.props, {
      words: 'onboarding',
      accent: '#1863dc',
      light: '#fff',
    })
  }
  stop() {
    this.stopFx?.()
  }
  renderVals() {
    return {}
  }
}
</script>
</body>
</html>
