<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TRIX — онбординг, сфера и уровень</title>
<script src="./support.js"></script>
<script src="./trail.js"></script>
<script src="./cursor-fx.js"></script>
<script src="./verge-fx.js"></script>
<link rel="stylesheet" href="verge.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@100..1000&amp;family=Onest:wght@300..700&amp;family=Martian+Mono:wdth,wght@75..112.5,400..700&amp;family=Literata:ital,opsz,wght@0,7..72,400..500;1,7..72,400&amp;display=swap">
<style>
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:1080px}
.side{overflow:hidden;margin:16px 0 16px 16px;padding:40px;display:flex;flex-direction:column;justify-content:space-between}
.side .brand{color:#fff}
.big{font-family:var(--disp);font-weight:900;font-size:clamp(150px,20vw,300px);line-height:.74;letter-spacing:-.01em}
.big span{font-weight:200;color:rgba(255,255,255,.55)}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prog span{height:6px;border-radius:3px;background:rgba(255,255,255,.25)}
.prog span.on{background:var(--mint)}
.form .stream{--tc:96px;--gap:40px}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.lvl{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--field);cursor:pointer;transition:background .2s,box-shadow .2s}
.lvl:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.lvl input{position:absolute;opacity:0;width:1px;height:1px}
.lvl:has(input:checked){background:var(--mint);box-shadow:inset 0 0 0 1px var(--mint-line);--ink:#000;--ink-2:rgba(0,0,0,.64);color:#000}
.lvl:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.bars{display:flex;align-items:flex-end;gap:4px;height:28px}
.bars i{width:8px;border-radius:2px;background:var(--bg-3)}
.bars i.on{background:var(--uv)}
.lvl:has(input:checked) .bars i.on{background:#000}
</style>
</helmet>
<div class="vg">
<div class="split">
<aside class="side tile uv fx-field" data-rv>
<a href="#" class="brand">TRIX<b></b></a>
<div style="display:flex;flex-direction:column;gap:18px;max-width:380px">
<span class="k">Шаг 1 из 3</span>
<div role="progressbar" aria-label="Заполнение профиля" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1" class="prog"><span class="on"></span><span></span><span></span></div>
<p class="small muted">По сфере и опыту выступлений подберём мероприятия, где ваш доклад будет к месту.</p>
</div>
<span class="big" aria-hidden="true">01<span>/03</span></span>
</aside>

<main class="form" style="padding:88px 80px 48px 72px;display:flex;flex-direction:column;gap:44px;min-width:0">
<div data-rv style="display:flex;flex-direction:column;gap:20px">
<h1 class="d-1">Расскажите о себе</h1>
<p class="deck" style="max-width:560px">По сфере и опыту выступлений подберём мероприятия, где ваш доклад будет к месту.</p>
</div>

<form class="stream" style="gap:48px">
<fieldset class="st" style="border:0;margin:0;padding:0;min-width:0">
<legend class="sr">Сфера</legend>
<div class="st-time k" aria-hidden="true">Сфера<b>01</b></div>
<div class="picks" data-rv style="padding-top:12px">
<label class="pick"><input type="radio" name="sphere" checked>Backend</label>
<label class="pick"><input type="radio" name="sphere">Frontend</label>
<label class="pick"><input type="radio" name="sphere">Mobile</label>
<label class="pick"><input type="radio" name="sphere">Data и ML</label>
<label class="pick"><input type="radio" name="sphere">DevOps</label>
<label class="pick"><input type="radio" name="sphere">QA</label>
<label class="pick"><input type="radio" name="sphere">Продукт</label>
<label class="pick"><input type="radio" name="sphere">Дизайн</label>
<label class="pick"><input type="radio" name="sphere">Аналитика</label>
<label class="pick"><input type="radio" name="sphere">Другое</label>
</div>
</fieldset>

<fieldset class="st" style="border:0;margin:0;padding:0;min-width:0">
<legend class="sr">Опыт выступлений</legend>
<div class="st-time k" aria-hidden="true">Опыт<b>02</b></div>
<div class="lvls" data-rv style="padding-top:12px">
<label class="lvl"><input type="radio" name="level"><span class="bars" aria-hidden="true"><i class="on" style="height:10px"></i><i style="height:18px"></i><i style="height:28px"></i></span><span class="h-20">Начинающий</span><span class="small muted">Ещё не выступал или выступал пару раз</span></label>
<label class="lvl"><input type="radio" name="level"><span class="bars" aria-hidden="true"><i class="on" style="height:10px"></i><i class="on" style="height:18px"></i><i style="height:28px"></i></span><span class="h-20">Есть опыт</span><span class="small muted">Выступал на митапах или внутри компании</span></label>
<label class="lvl"><input type="radio" name="level" checked><span class="bars" aria-hidden="true"><i class="on" style="height:10px"></i><i class="on" style="height:18px"></i><i class="on" style="height:28px"></i></span><span class="h-20">Опытный</span><span class="small muted">Регулярно выступаю на конференциях</span></label>
</div>
</fieldset>

<div class="st">
<div class="st-time" aria-hidden="true"></div>
<div data-rv style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px">
<span class="small muted">Всё можно поменять позже в профиле</span>
<a href="vg-selection.dc.html" class="b b-mint">Далее<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div>
</div>
</form>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100},"theme":{"editor":"enum","options":["Светлая","Тёмная"],"default":"Светлая","section":"Тема"},"cursor":{"editor":"enum","options":["Слова","Линза-негатив","Перекрестие","Выкл"],"default":"Слова","section":"Эффект курсора"},"letters":{"editor":"enum","options":["Мелкие","Средние","Крупные"],"default":"Мелкие","section":"Эффект курсора"},"zone":{"editor":"enum","options":["Как было","Весь белый фон","Фон и карточки","Только карточки"],"default":"Как было","section":"Эффект курсора"},"reveal":{"editor":"enum","options":["Шторка","Расшифровка","Подъём","Выкл"],"default":"Подъём","section":"Появление"},"display":{"editor":"enum","options":["Шёпот","Резина","Обычный"],"default":"Обычный","section":"Заголовки"},"rail":{"editor":"enum","options":["Рисуется","Статичная"],"default":"Рисуется","section":"Лента"}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.start()
  }
  componentDidUpdate(prev) {
    if (window.VergeFX?.keys.some(k => prev[k] !== this.props[k])) {
      this.stop()
      this.start()
    }
  }
  componentWillUnmount() {
    this.stop()
  }
  start() {
    this.stopFx = window.VergeFX?.run(this.props, { words: 'onboarding' })
  }
  stop() {
    this.stopFx?.()
  }
  renderVals() {
    return {}
  }
}
</script>
</body>
</html>
