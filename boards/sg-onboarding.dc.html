<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TRIX — онбординг, сфера и уровень</title>
<script src="./support.js"></script>
<script src="./cursor-fx.js"></script>
<script src="./trail.js"></script>
<link rel="stylesheet" href="sunset-tokens.css">
<link rel="stylesheet" href="ds/sunset-glow/components/bundle.css">
<script src="ds/sunset-glow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--primary)}
a:focus-visible,button:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
label:has(input:focus-visible){outline:2px solid var(--focus-ring);outline-offset:2px}
</style>
</helmet>
<div data-fx style="min-height: 100vh; display: flex; flex-wrap: wrap; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 1.55">

<x-import component-from-global-scope="SunsetGlow.AnimatedBackground" variant="hero" fade="{{no}}" as="aside" style="flex: 1 1 420px; min-width: 0; min-height: 360px">
<div style="height: 100%; box-sizing: border-box; padding: 32px 48px 64px; display: flex; flex-direction: column; justify-content: space-between; gap: 64px">
<a href="Main.dc.html" style="font-size: 18px; font-weight: 500; line-height: 1.4; color: var(--ink); text-decoration: none">TRIX</a>
<div style="display: flex; flex-direction: column; gap: 20px; max-width: 460px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-tint)">Шаг 1 из 3</span>
<h1 style="margin: 0; font-family: var(--font-display); font-size: 64px; font-weight: 500; line-height: 1.04; letter-spacing: -1px">Расскажите о себе</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.5; color: var(--ink-tint)">По сфере и опыту выступлений подберём мероприятия, где ваш доклад будет к месту.</p>
</div>
<ol aria-label="Шаги" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
<li style="display: flex; align-items: center; gap: 12px; font-weight: 500"><span style="width: 28px; height: 28px; border-radius: 9999px; background: var(--ink); color: var(--on-ink); display: inline-flex; align-items: center; justify-content: center; font-size: 13px">1</span>Сфера и опыт</li>
<li style="display: flex; align-items: center; gap: 12px; color: var(--ink-tint)"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 9999px; border: 1px solid var(--ink-tint); display: inline-flex; align-items: center; justify-content: center; font-size: 13px">2</span>Цель</li>
<li style="display: flex; align-items: center; gap: 12px; color: var(--ink-tint)"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 9999px; border: 1px solid var(--ink-tint); display: inline-flex; align-items: center; justify-content: center; font-size: 13px">3</span>Предпочтения</li>
</ol>
</div>
</x-import>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 96px clamp(24px, 6vw, 96px) 64px; display: flex; flex-direction: column">
<form style="max-width: 640px; display: flex; flex-direction: column; gap: 48px">
<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="padding: 0; margin-bottom: 16px; font-size: 22px; font-weight: 500; line-height: 1.3">Сфера</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 9999px; background: var(--ink); color: var(--on-ink); font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="sphere" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Backend</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid var(--hairline-strong); border-radius: 9999px; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Frontend</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid var(--hairline-strong); border-radius: 9999px; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Mobile</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid var(--hairline-strong); border-radius: 9999px; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Data и ML</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid var(--hairline-strong); border-radius: 9999px; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">DevOps</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid var(--hairline-strong); border-radius: 9999px; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">QA</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid var(--hairline-strong); border-radius: 9999px; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Продукт</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid var(--hairline-strong); border-radius: 9999px; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Дизайн</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid var(--hairline-strong); border-radius: 9999px; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Аналитика</label>
<label style="position: relative; display: inline-flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid var(--hairline-strong); border-radius: 9999px; color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer"><input type="radio" name="sphere" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Другое</label>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="padding: 0; margin-bottom: 16px; font-size: 22px; font-weight: 500; line-height: 1.3">Опыт выступлений</legend>
<div style="display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; align-items: flex-start; gap: 14px; box-sizing: border-box; padding: 20px 24px; border: 1px solid var(--hairline-soft); border-radius: 12px; background: var(--canvas); cursor: pointer">
<input type="radio" name="level" style="flex: none; width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--primary)">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 500; line-height: 1.4">Начинающий</span><span style="font-size: 14px; color: var(--slate)">Ещё не выступал или выступал пару раз</span></span>
</label>
<label style="display: flex; align-items: flex-start; gap: 14px; box-sizing: border-box; padding: 20px 24px; border: 1px solid var(--hairline-soft); border-radius: 12px; background: var(--canvas); cursor: pointer">
<input type="radio" name="level" style="flex: none; width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--primary)">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 500; line-height: 1.4">Есть опыт</span><span style="font-size: 14px; color: var(--slate)">Выступал на митапах или внутри компании</span></span>
</label>
<label style="display: flex; align-items: flex-start; gap: 14px; box-sizing: border-box; padding: 19px 23px; border: 2px solid var(--primary); border-radius: 12px; background: var(--cream-light); cursor: pointer">
<input type="radio" name="level" checked style="flex: none; width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--primary)">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 500; line-height: 1.4">Опытный</span><span style="font-size: 14px; color: var(--slate)">Регулярно выступаю на конференциях</span></span>
</label>
</div>
</fieldset>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 24px; border-top: 1px solid var(--hairline)">
<span style="font-size: 13px; color: var(--steel)">Всё можно поменять позже в профиле</span>
<x-import component-from-global-scope="SunsetGlow.Button" variant="primary" href="#">Далее<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></x-import>
</div>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1100}, "cursor": {"editor": "enum", "options": ["Слова", "Линза-негатив", "Перекрестие", "Выкл"], "default": "Слова", "section": "Эффект курсора"}, "letters": {"editor": "enum", "options": ["Мелкие", "Средние", "Крупные"], "default": "Мелкие", "section": "Эффект курсора"}, "zone": {"editor": "enum", "options": ["Как было", "Весь белый фон", "Фон и карточки", "Только карточки"], "default": "Как было", "section": "Эффект курсора"}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.start()
  }
  componentDidUpdate(prev) {
    if (window.TrixFX?.keys.some(k => prev[k] !== this.props[k])) {
      this.stop()
      this.start()
    }
  }
  componentWillUnmount() {
    this.stop()
  }
  start() {
    const T = window.TrixTrail
    this.stopFx = window.TrixFX?.run(this.props, {
      words: 'onboarding',
      accent: '#cc3a05',
      light: '#fff8e0',
      legacy: () => T.mount('.sg-aurora', el => ({ color: getComputedStyle(el).getPropertyValue('--primary-deep').trim() || '#fff' })),
    })
  }
  stop() {
    this.stopFx?.()
  }
  renderVals() {
    return {}
  }
}
</script>
</body>
</html>
